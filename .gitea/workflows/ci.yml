name: Build, Test, and Publish Frappe HR Docker Image

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    paths:
      - "apps/hr_ess_api/**"
      - "deploy/**"
      - ".gitea/workflows/ci.yml"

env:
  REGISTRY: gitea.local.coddicted.com
  IMAGE_NAME: ${{ gitea.repository_owner }}/frappe-custom-hrms

jobs:
  validate-and-build:
    name: Test, Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Frontend Validation Gate
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dashboard Dependencies
        run: npm ci
        working-directory: apps/hr_ess_api/dashboard

      - name: Lint Dashboard
        run: npx oxlint
        working-directory: apps/hr_ess_api/dashboard

      - name: Verify Dashboard Build
        run: npm run build
        working-directory: apps/hr_ess_api/dashboard

      # 2. Registry Authentication
      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # 3. Dynamic Tagging (matching buzzma convention)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=branch,suffix=-beta-${{ steps.sha.outputs.short }},enable=${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build and Push Custom Frappe Image
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            gitea_token=${{ secrets.DOCKER_PASSWORD }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

