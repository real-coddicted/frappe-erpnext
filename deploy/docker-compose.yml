x-app: &app
  image: ${IMAGE}
  restart: unless-stopped
  volumes:
    - ./sites:/home/frappe/frappe-bench/sites
    - ./logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --innodb-buffer-pool-size=1G
      - --max-connections=300
      - --innodb-file-per-table=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --expire-logs-days=7
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: mysqladmin ping -h localhost --password=${DB_ROOT_PASSWORD}
      interval: 5s
      retries: 20
    volumes:
      - ./db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - ./redis-queue-data:/data

  configurator:
    image: ${IMAGE}
    restart: "no"
    user: "0:0"
    command:
      - bash
      - -c
      - >
        mkdir -p /home/frappe/frappe-bench/sites /home/frappe/frappe-bench/logs;
        chown -R 1000:1000 /home/frappe/frappe-bench/sites /home/frappe/frappe-bench/logs;
        chmod -R 755 /home/frappe/frappe-bench/sites /home/frappe/frappe-bench/logs;
        su -c "
          cd /home/frappe/frappe-bench;
          [ -f sites/common_site_config.json ] || echo '{}' > sites/common_site_config.json;
          [ -f sites/apps.txt ] || ls -1 apps > sites/apps.txt;
          bench set-config -g db_host db;
          bench set-config -gp db_port 3306;
          bench set-config -g redis_cache redis://redis-cache:6379;
          bench set-config -g redis_queue redis://redis-queue:6379;
          bench set-config -g redis_socketio redis://redis-queue:6379;
          bench set-config -gp socketio_port 9000;
        " frappe
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
      - ./logs:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy

  create-site:
    <<: *app
    restart: "no"
    command:
      - bash
      - -c
      - >
        wait-for-it -t 120 db:3306;
        [ -d sites/${SITE_NAME} ] ||
        bench new-site ${SITE_NAME}
        --mariadb-user-host-login-scope=%
        --db-root-password=${DB_ROOT_PASSWORD}
        --admin-password=${ADMIN_PASSWORD}
        --install-app erpnext --install-app hrms
        --install-app eme_admin --install-app hr_ess_api
        --set-default
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  backend:
    <<: *app
    environment:
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -H \"Host: $${FRAPPE_SITE_NAME_HEADER}\" http://127.0.0.1:8000/api/method/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  websocket:
    <<: *app
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]

  scheduler:
    <<: *app
    command: [bench, schedule]
    healthcheck:
      test: ["CMD-SHELL", "grep -q schedule /proc/1/cmdline || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  queue-short:
    <<: *app
    command: [bench, worker, --queue, "short,default"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q worker /proc/1/cmdline || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  queue-long:
    <<: *app
    command: [bench, worker, --queue, long]
    healthcheck:
      test: ["CMD-SHELL", "grep -q worker /proc/1/cmdline || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    <<: *app
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "127.0.0.1:${EMPLOYEE_PORT:-8082}:8080"
      - "127.0.0.1:${ADMIN_PORT:-8083}:8081"
    depends_on:
      - backend
      - websocket
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - PORTAL_DOMAIN=${PORTAL_DOMAIN:-portal.example.com}
      - DESK_DOMAIN=${DESK_DOMAIN:-desk.example.com}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - FRAPPE_SITE_NAME_HEADER=${FRAPPE_SITE_NAME_HEADER:-mysite.localhost}
      - CADDY_GLOBAL_OPTIONS=${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  caddy-data:
  caddy-config:
